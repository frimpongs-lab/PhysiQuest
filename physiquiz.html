<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | PhysiQuest</title>
  <link rel="stylesheet" href="style.css">
  <script src="js.script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="physihome.html">PhysiQuest</a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" onclick="toggleMenu()">☰</button>
    <nav id="navigation" class="navigation">
      <a href="physihome.html">Home</a>
      <a href="physitopics.html">Topics</a>
      <a href="physiprogress.html">Progress</a>
      <a href="physireferences.html">References</a>
    </nav>
    <div class="points-pill">Points: <strong id="headerPoints">0</strong></div>
    <div class="user-account">
    <span id="loggedInName">Welcome!</span>
    <button id="logoutButton" type="button" class="logout-button">
        Log out
    </button>
</div>
  </header>

  <main class="container">
    <a class="back-link" href="physitopics.html">← Exit quiz</a>

    <section class="quiz-card">
      <h1 id="quizTitle">Physics Quiz</h1>
      <p id="quizSubtitle" class="intro">Choose the best answer for each question.</p>
      <p id="questionCounter" class="question-counter">Question 1 of 15</p>
      <p class="points-note">+10 points per correct answer</p>

      <div class="progress-track">
        <div id="quizProgressBar"></div>
      </div>

      <h2 id="questionText">Question text</h2>
      <div id="answerOptions" class="answer-options"></div>
      <p id="answerFeedback" class="feedback" aria-live="polite"></p>

      <div class="button-row">
        <button id="submitAnswer" class="button" type="button" onclick="submitQuizAnswer()">Submit Answer</button>
        <button id="nextQuestion" class="button" type="button" onclick="nextQuizQuestion()" hidden>Next Question</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Learn, practise, improve · <a href="physireferences.html">References</a></p>
  </footer>
</body>
</html>
